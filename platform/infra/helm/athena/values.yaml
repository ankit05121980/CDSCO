global:
  imageRegistry: ghcr.io/athena
  imagePullPolicy: IfNotPresent

api:
  image: api
  tag: latest
  replicas: 3
  port: 3002
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: '1', memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
  env:
    NODE_ENV: production
    DB_TYPE: postgres
    AI_PROVIDER: openai
    VECTOR_STORE: chroma

web:
  image: web
  tag: latest
  replicas: 3
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: app.athena.example.com
  tls: true

postgres:
  host: athena-postgres
  database: athena

secrets:
  # Reference an existing secret managed by External Secrets Operator in prod.
  existingSecret: athena-api-secrets
