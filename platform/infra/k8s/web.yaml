apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-web
  namespace: athena
  labels:
    app: athena-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: athena-web
  template:
    metadata:
      labels:
        app: athena-web
    spec:
      containers:
        - name: web
          image: ghcr.io/athena/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_PROXY_URL
              value: 'http://athena-api'
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: athena-web
  namespace: athena
spec:
  selector:
    app: athena-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: athena
  namespace: athena
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['app.athena.example.com']
      secretName: athena-tls
  rules:
    - host: app.athena.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: athena-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: athena-web
                port:
                  number: 80
