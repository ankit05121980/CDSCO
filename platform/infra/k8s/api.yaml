apiVersion: v1
kind: ConfigMap
metadata:
  name: athena-api-config
  namespace: athena
data:
  NODE_ENV: 'production'
  PORT: '3002'
  DB_TYPE: 'postgres'
  PGHOST: 'athena-postgres'
  PGPORT: '5432'
  PGDATABASE: 'athena'
  DB_SYNC: 'false'
  AI_PROVIDER: 'openai'
  VECTOR_STORE: 'chroma'
  CHROMA_URL: 'http://athena-chroma:8000'
  CORS_ORIGINS: 'https://app.athena.example.com'
---
apiVersion: v1
kind: Secret
metadata:
  name: athena-api-secrets
  namespace: athena
type: Opaque
stringData:
  # Provided by external secret manager (AWS Secrets Manager / Vault) in prod.
  PGUSER: 'athena'
  PGPASSWORD: 'change-me'
  JWT_ACCESS_SECRET: 'change-me-access'
  JWT_REFRESH_SECRET: 'change-me-refresh'
  OPENAI_API_KEY: 'change-me'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-api
  namespace: athena
  labels:
    app: athena-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: athena-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: athena-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/athena/api:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: athena-api-config
            - secretRef:
                name: athena-api-secrets
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: athena-api
  namespace: athena
spec:
  selector:
    app: athena-api
  ports:
    - port: 80
      targetPort: 3002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: athena-api
  namespace: athena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: athena-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: athena-api
  namespace: athena
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: athena-api
