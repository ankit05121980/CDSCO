groups:
  - name: athena-api
    rules:
      - alert: AthenaApiDown
        expr: up{job="athena-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Athena API instance down'
          description: 'An API pod has not been scrapeable for 2 minutes.'

      - alert: AthenaApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="athena-api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="athena-api"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Elevated 5xx error rate (>5%)'

      - alert: AthenaApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="athena-api"}[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'API p95 latency above 1s'
