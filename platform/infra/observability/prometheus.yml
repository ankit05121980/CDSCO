global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert.rules.yml

scrape_configs:
  # Kubernetes service discovery for the API pods (expects /metrics once the
  # prom-client middleware is enabled — see docs/OBSERVABILITY.md).
  - job_name: athena-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [athena]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: athena-api
        action: keep
    metrics_path: /api/metrics

  - job_name: athena-blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://athena-api/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
