# DDRS — Digital Drugs Regulatory System
#
# Default (SQLite, zero config):
#   docker compose up --build
#   open http://localhost:3001
#
# With PostgreSQL (production-like):
#   docker compose --profile postgres up --build
#
services:
  ddrs:
    build: .
    image: ddrs:latest
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: "change-me-in-production"
      # SQLite (default). Comment these out and use the postgres block below
      # together with `--profile postgres` to run on PostgreSQL.
      DB_TYPE: "sqlite"
      DB_PATH: "/app/data/ddrs.sqlite"
    volumes:
      - ddrs-data:/app/data
    restart: unless-stopped

  # ---- Optional PostgreSQL deployment (enable with: --profile postgres) ----
  ddrs-pg:
    profiles: ["postgres"]
    build: .
    image: ddrs:latest
    depends_on:
      - db
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: "change-me-in-production"
      DB_TYPE: "postgres"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ddrs
      PGPASSWORD: ddrs
      PGDATABASE: ddrs
      SEED_ON_START: "true"
    restart: unless-stopped

  db:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: ddrs
      POSTGRES_PASSWORD: ddrs
      POSTGRES_DB: ddrs
    volumes:
      - ddrs-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ddrs-data:
  ddrs-pg:
